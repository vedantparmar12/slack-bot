[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-rag"
version = "0.1.0"
description = "Production-grade RAG system for support search across Slack, Confluence, and developer docs"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Vector DB
    "qdrant-client>=1.12.0",
    # LLM & Embeddings
    "openai>=1.50.0",
    "tiktoken>=0.8.0",
    # Reranker
    "sentence-transformers>=3.0.0",
    # Cache & Queue
    "redis[hiredis]>=5.0.0",
    "arq>=0.26.0",
    # Slack
    "slack-bolt>=1.20.0",
    "slack-sdk>=3.33.0",
    # Confluence
    "atlassian-python-api>=3.41.0",
    # Git
    "gitpython>=3.1.0",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Scheduling
    "apscheduler>=3.10.0",
    # Document parsing
    "beautifulsoup4>=4.12.0",
    "markdownit-py>=3.0.0",
    "python-frontmatter>=1.1.0",
    # HTTP
    "httpx>=0.27.0",
    # Logging
    "structlog>=24.0.0",
    # Utils
    "python-dotenv>=1.0.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
